<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
  <title id="title">Luna Visual ayar ekranı önizlemesi</title>
  <desc id="desc">Oyun dünyasının üzerinde, dört görsel özelliği ayrı ayrı açıp kapatan opak lacivert ayar paneli.</desc>
  <defs>
    <linearGradient id="scene" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c82aa"/>
      <stop offset="1" stop-color="#213c61"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182a43"/>
      <stop offset="1" stop-color="#142238"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#223650"/>
      <stop offset="1" stop-color="#1c2d43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#53dce9"/>
      <stop offset="1" stop-color="#7e9cff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity=".58"/>
    </filter>
  </defs>
  <rect width="1160" height="650" rx="28" fill="url(#scene)"/>
  <path d="M0 415h125v-65h90v85h100v-45h85v100h360v-55h100v-85h85v70h115v230H0Z" fill="#305c55"/>
  <path d="M0 480h170v-45h85v55h150v-35h100v70h220v-55h120v-35h115v215H0Z" fill="#244b48"/>
  <path d="M0 520h115v-40h85v75h135v-30h90v70h290v-50h90v-35h100v140H0Z" fill="#193a3d"/>
  <rect width="1160" height="650" rx="28" fill="#0b1422" opacity=".32"/>
  <rect x="250" y="24" width="660" height="596" rx="20" fill="url(#panel)" stroke="#344c68" stroke-width="2" filter="url(#shadow)"/>
  <rect x="270" y="29" width="620" height="12" rx="6" fill="url(#accent)"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="580" y="91" text-anchor="middle" fill="#f3f7ff" font-size="31" font-weight="750">Luna Visual</text>
    <text x="580" y="121" text-anchor="middle" fill="#9fb4d0" font-size="15">Görüşünü özellikleri tek tek seçerek ayarla</text>
    <g>
      <rect x="290" y="151" width="580" height="45" rx="11" fill="url(#button)" stroke="#3c536d"/>
      <text x="314" y="180" fill="#f1f6ff" font-size="17" font-weight="650">Tam parlaklık</text>
      <rect x="730" y="160" width="120" height="27" rx="7" fill="#26354a"/>
      <text x="790" y="179" text-anchor="middle" fill="#bac8da" font-size="13" font-weight="700">KAPALI</text>
      <text x="580" y="214" text-anchor="middle" fill="#aab9cd" font-size="12">Kaydedilmiş gama ayarını değiştirmeden dünyayı aydınlatır.</text>
    </g>
    <g>
      <rect x="290" y="244" width="580" height="45" rx="11" fill="url(#button)" stroke="#3c536d"/>
      <text x="314" y="273" fill="#f1f6ff" font-size="17" font-weight="650">Warden karanlığı</text>
      <rect x="730" y="253" width="120" height="27" rx="7" fill="#26354a"/>
      <text x="790" y="272" text-anchor="middle" fill="#bac8da" font-size="13" font-weight="700">KAPALI</text>
      <text x="580" y="307" text-anchor="middle" fill="#aab9cd" font-size="12">Karanlık sisini ve kararmayı gizler; efekt etkin kalır.</text>
    </g>
    <g>
      <rect x="290" y="337" width="580" height="45" rx="11" fill="url(#button)" stroke="#3c536d"/>
      <text x="314" y="366" fill="#f1f6ff" font-size="17" font-weight="650">Berrak su, lav ve toz karı</text>
      <rect x="730" y="346" width="120" height="27" rx="7" fill="#26354a"/>
      <text x="790" y="365" text-anchor="middle" fill="#bac8da" font-size="13" font-weight="700">KAPALI</text>
      <text x="580" y="400" text-anchor="middle" fill="#aab9cd" font-size="12">Sıvıların ve toz karının içindeyken görüş sisini azaltır.</text>
    </g>
    <g>
      <rect x="290" y="430" width="580" height="45" rx="11" fill="url(#button)" stroke="#3c536d"/>
      <text x="314" y="459" fill="#f1f6ff" font-size="17" font-weight="650">Lavda net görüş</text>
      <rect x="730" y="439" width="120" height="27" rx="7" fill="#26354a"/>
      <text x="790" y="458" text-anchor="middle" fill="#bac8da" font-size="13" font-weight="700">KAPALI</text>
      <text x="580" y="493" text-anchor="middle" fill="#aab9cd" font-size="12">Ateş Direnciyle veya Yaratıcı modda lav görüşünü açar.</text>
    </g>
    <rect x="505" y="535" width="150" height="36" rx="9" fill="#23354c" stroke="#50647c"/>
    <text x="580" y="559" text-anchor="middle" fill="#e5edf8" font-size="14" font-weight="650">TAMAM</text>
    <text x="580" y="597" text-anchor="middle" fill="#7e91ab" font-size="12" letter-spacing="1.4">MENÜYÜ AÇMAK İÇİN O</text>
  </g>
</svg>
